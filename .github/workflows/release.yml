name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

jobs:
  # Builds the package the way `cargo publish` would, which runs the build
  # scripts and proc macros of every dependency. The job therefore gets no
  # OIDC token and hands nothing to the publish job.
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Check that the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          if [ "$tag" != "$version" ]; then
            echo "tag v${tag} does not match package version ${version}" >&2
            exit 1
          fi
      - run: cargo publish --dry-run --locked

  # Builds the release binaries, which also runs the build scripts and proc
  # macros of every dependency, so these jobs can only read the repository.
  # The release job uploads what they package.
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Built natively on an ARM runner rather than with cross, so the
          # binary links against the runner's glibc, as the x86_64 one does.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # No cache: one saved by another run could carry a poisoned build into
      # the released binaries.
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          target: ${{ matrix.target }}
          cache: false

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          archive="git-branch-status-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar czvf "$archive" -C target/${{ matrix.target }}/release git-branch-status
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "git-branch-status-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Compress-Archive -Path "target\${{ matrix.target }}\release\git-branch-status.exe" -DestinationPath $archive
          (Get-FileHash $archive -Algorithm SHA256).Hash | Out-File -FilePath "$archive.sha256" -NoNewline

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: git-branch-status-${{ github.ref_name }}-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 1

  # Uploads the packaged binaries in one go. This is the only job that can
  # write to the repository, so it runs no build and no third-party action:
  # only the runner's gh on the downloaded files.
  release:
    name: Publish GitHub release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      # The build jobs name the files, so check that exactly the expected set
      # arrived for this tag before uploading any of it. Keep the targets in
      # step with the build matrix.
      - name: Check the packaged files
        working-directory: dist
        run: |
          {
            for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin; do
              echo "git-branch-status-${GITHUB_REF_NAME}-${target}.tar.gz"
              echo "git-branch-status-${GITHUB_REF_NAME}-${target}.tar.gz.sha256"
            done
            echo "git-branch-status-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.zip"
            echo "git-branch-status-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.zip.sha256"
          } | sort > ../expected.txt
          printf '%s\n' * | sort > ../actual.txt
          diff ../expected.txt ../actual.txt

      # A release created by hand creates the tag and so starts this workflow,
      # so add to that release when it exists and create a bare one otherwise.
      # Existing files are never replaced: a re-run after a partial upload
      # needs the uploaded files deleted first.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "" dist/*
          fi

  # Packs the same commit again and uploads it without compiling. Any step
  # in this job can request the OIDC token, so it runs only actions/checkout,
  # rust-lang's own tools and the runner image: no dependency code and no
  # other actions.
  publish:
    name: Publish to crates.io
    needs: [verify, release]
    runs-on: ubuntu-latest
    permissions:
      # Required for crates.io Trusted Publishing (OIDC).
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # Exchanges the workflow's OIDC token for a short-lived crates.io token.
      - uses: rust-lang/crates-io-auth-action@v1.0.6
        id: auth
      - run: cargo publish --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
